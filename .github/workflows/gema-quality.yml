
name: GEMA Quality v1.3

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-dependencies:
    name: ESLint + TypeScript + Tests + Build + Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: ESLint analysis
        run: pnpm exec eslint .

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_CI_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure the CLERK_CI_PUBLISHABLE_KEY repository variable."
            exit 1
          fi
          pnpm build

      - name: Dependency vulnerability audit (HIGH or CRITICAL)
        run: pnpm audit --audit-level high
