name: GEMA Quality - Baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-dependencies:
    name: ESLint + TypeScript + Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Requires package.json with "packageManager": "pnpm@<your-project-version>".
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: ESLint analysis
        run: pnpm exec eslint .
      
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: Dependency vulnerability audit (HIGH or CRITICAL)
        run: pnpm audit --audit-level high
